<!DOCTYPE html>
<html>
<head>
    <title>Convert PDF to PowerPoint</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Convert PDF to PowerPoint</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Convert</button>
    </form>

    {% if pptx_filename %}
        <div class="mt-4 alert alert-success">
            <strong>Success!</strong> File converted.
            <br>
            <a href="{{ media_url }}{{ pptx_filename }}" class="btn btn-success mt-2" download>Download PowerPoint File</a>
        </div>
    {% endif %}
</body>
</html>
