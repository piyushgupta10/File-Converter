<!DOCTYPE html>
<html>
<head>
    <title>File Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h2 class="mb-4">Welcome to the File Converter</h2>
    <p>Select a conversion type:</p>

    <div class="d-grid gap-3 col-6 mx-auto">
        <a href="{% url 'upload_pdf' %}" class="btn btn-outline-primary">PDF to Word</a>
        <a href="{% url 'upload_word' %}" class="btn btn-outline-success">Word to PDF</a>
        <a href="{% url 'upload_pdf_to_ppt' %}" class="btn btn-outline-warning">PDF to PowerPoint</a>
    </div>
</body>
</html>
